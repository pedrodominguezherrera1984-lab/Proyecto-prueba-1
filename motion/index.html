<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXO Motion</title>
  <meta name="description" content="Secuencia cinematográfica de 15 s: tipografía cinética, transiciones de forma, elementos 3D y cámara continua.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05070a;
      --primary: #8DB843;
      --primary-glow: rgba(141, 184, 67, 0.55);
      --text: #f2f6ec;
      --muted: rgba(242, 246, 236, 0.6);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    #stage {
      position: fixed;
      inset: 0;
    }

    canvas#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    /* ---------- Capa tipográfica ---------- */
    #type {
      position: absolute;
      inset: 0;
      pointer-events: none;
      perspective: 900px;
      display: grid;
      place-items: center;
    }

    .scene {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      transform-style: preserve-3d;
      opacity: 0;
    }

    .word {
      display: flex;
      justify-content: center;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 0.9;
      font-size: clamp(48px, 11vw, 180px);
      transform-style: preserve-3d;
      white-space: nowrap;
    }

    .word .ch {
      display: inline-block;
      transform-style: preserve-3d;
      will-change: transform, opacity, filter;
      text-shadow: 0 0 40px rgba(141, 184, 67, 0.25);
    }

    .accent { color: var(--primary); text-shadow: 0 0 50px var(--primary-glow) !important; }

    .sub {
      margin-top: 2.2vh;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      font-size: clamp(11px, 1.35vw, 20px);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }

    .mask { overflow: hidden; padding: 3vw 4vw 1.5vw; margin: -3vw 0 -1.5vw; }
    .mask > .word { will-change: transform; }

    #s4 .word { font-size: clamp(40px, 9vw, 150px); position: absolute; }

    #s5 .word { font-size: clamp(64px, 15vw, 240px); letter-spacing: 0; }
    #s5 .rule {
      width: min(46vw, 640px);
      height: 2px;
      margin-top: 2.4vh;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
      transform-origin: center;
      box-shadow: 0 0 18px var(--primary-glow);
    }

    /* Anillo SVG que se dibuja */
    #ring {
      position: absolute;
      width: min(70vmin, 760px);
      height: min(70vmin, 760px);
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      overflow: visible;
    }
    #ring circle { fill: none; stroke: var(--primary); stroke-width: 1.2; filter: drop-shadow(0 0 6px var(--primary)); }
    #ring path { fill: none; stroke: var(--text); stroke-width: 1; opacity: 0.5; }

    /* ---------- Acabado cinematográfico ---------- */
    .bar {
      position: absolute;
      left: 0;
      right: 0;
      height: 12.5vh;
      background: #000;
      z-index: 5;
    }
    .bar.top { top: 0; }
    .bar.bottom { bottom: 0; }

    #vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, 0.75) 100%);
      z-index: 4;
    }

    #grain {
      position: absolute;
      inset: -50%;
      pointer-events: none;
      opacity: 0.07;
      z-index: 4;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    #flash {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(200, 240, 140, 0.9), rgba(141, 184, 67, 0.2) 40%, transparent 70%);
      opacity: 0;
      z-index: 3;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    /* ---------- Controles ---------- */
    #hud {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: calc(12.5vh - 34px);
      z-index: 6;
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      opacity: 0.85;
    }
    #hud button {
      background: transparent;
      border: 1px solid rgba(242, 246, 236, 0.25);
      color: var(--text);
      font: inherit;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
    }
    #hud button:hover { border-color: var(--primary); color: var(--primary); }
    #track { flex: 1; height: 2px; background: rgba(242, 246, 236, 0.15); position: relative; cursor: pointer; }
    #fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--primary); box-shadow: 0 0 8px var(--primary); }
    body.capture #hud { display: none; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <div id="stage">
    <canvas id="gl"></canvas>

    <div id="flash"></div>

    <div id="type">
      <svg id="ring" viewBox="-100 -100 200 200">
        <circle id="ringC" r="92" />
        <path id="ringP" d="M-60 -20 L0 -55 L60 -20 L35 50 L-35 50 Z" />
      </svg>

      <div class="scene" id="s1">
        <div class="word" data-split>CONECTA</div>
        <div class="sub">APIs · bases de datos · agentes</div>
      </div>

      <div class="scene" id="s2">
        <div class="word" data-split>AUTOMATIZA</div>
        <div class="sub">flujos visuales en segundos</div>
      </div>

      <div class="scene" id="s3">
        <div class="mask"><div class="word">SIN</div></div>
        <div class="mask"><div class="word accent">LÍMITES</div></div>
      </div>

      <div class="scene" id="s4">
        <div class="word" data-split>OPEN SOURCE</div>
        <div class="word accent" data-split>IA NATIVA</div>
        <div class="word" data-split>SELF‑HOSTED</div>
      </div>

      <div class="scene" id="s5">
        <div class="word" data-split>NE<span class="accent">X</span>O</div>
        <div class="rule"></div>
        <div class="sub">automatización visual e IA de código abierto</div>
      </div>
    </div>

    <div id="vignette"></div>
    <div id="grain"></div>
    <div class="bar top"></div>
    <div class="bar bottom"></div>

    <div id="hud">
      <button id="play">❚❚</button>
      <button id="replay">↺</button>
      <div id="track"><div id="fill"></div></div>
      <span id="clock">00.00 / 15.00</span>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    const DURATION = 15;
    const params = new URLSearchParams(location.search);
    const CAPTURE = params.has('capture');
    if (CAPTURE) document.body.classList.add('capture');

    // ================= Utilidades de tiempo =================
    const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
    const lerp = (a, b, t) => a + (b - a) * t;
    const prog = (t, a, b) => clamp((t - a) / (b - a));
    const ease = {
      inOutCubic: x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
      outExpo: x => x === 1 ? 1 : 1 - Math.pow(2, -10 * x),
      inExpo: x => x === 0 ? 0 : Math.pow(2, 10 * x - 10),
      outBack: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
      inOutQuint: x => x < 0.5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2,
      outCubic: x => 1 - Math.pow(1 - x, 3),
      inCubic: x => x * x * x,
    };

    // Pseudo-aleatorio determinista (para renders reproducibles)
    let seed = 1337;
    const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

    // ================= Escena 3D =================
    const canvas = document.getElementById('gl');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: CAPTURE });
    renderer.setPixelRatio(CAPTURE ? 1 : Math.min(devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.9;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05070a);
    scene.fog = new THREE.FogExp2(0x05070a, 0.028);

    const camera = new THREE.PerspectiveCamera(42, 16 / 9, 0.1, 200);

    const GREEN = new THREE.Color(0x8db843);
    const LIME = new THREE.Color(0xd4f58a);
    const WHITE = new THREE.Color(0xf2f6ec);

    scene.add(new THREE.AmbientLight(0x223322, 1.2));
    const key = new THREE.PointLight(0x8db843, 220, 60);
    key.position.set(6, 8, 10);
    scene.add(key);
    const rim = new THREE.PointLight(0x6fd3ff, 120, 60);
    rim.position.set(-10, -4, -6);
    scene.add(rim);

    // ---------- Nube de partículas que se transforma ----------
    const N = 9000;
    const R = 4.2;

    function shapeSphere(i) {
      const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y * y), th = i * 2.399963;
      return [Math.cos(th) * r * R, y * R, Math.sin(th) * r * R];
    }
    function shapeTorusKnot(i) {
      const u = (i / N) * Math.PI * 2 * 1, p = 2, q = 3;
      const tt = u;
      const cx = (2 + Math.cos(q * tt)) * Math.cos(p * tt);
      const cy = (2 + Math.cos(q * tt)) * Math.sin(p * tt);
      const cz = Math.sin(q * tt);
      const a = rand() * Math.PI * 2, rr = 0.42 * Math.sqrt(rand());
      return [(cx + Math.cos(a) * rr) * 1.45, (cy + Math.sin(a) * rr) * 1.45, (cz + Math.cos(a + 1.3) * rr) * 1.45];
    }
    function shapeCube(i) {
      // Superficie de un cubo con retícula marcada
      const s = 3.1, face = i % 6;
      const g = 14;
      let u = (Math.floor(rand() * (g + 1)) / g) * 2 - 1, v = rand() * 2 - 1;
      if (rand() < 0.5) [u, v] = [v, u];
      const m = [[1, u, v], [-1, u, v], [u, 1, v], [u, -1, v], [u, v, 1], [u, v, -1]][face];
      return [m[0] * s, m[1] * s, m[2] * s];
    }
    function shapeGalaxy(i) {
      const arms = 3, arm = i % arms;
      const r = Math.pow(rand(), 0.7) * 7.5;
      const a = r * 0.9 + (arm / arms) * Math.PI * 2 + (rand() - 0.5) * 0.5;
      return [Math.cos(a) * r, (rand() - 0.5) * 0.5 * (1 - r / 8), Math.sin(a) * r];
    }
    function shapeLogo(i) {
      // Anillo + red de nodos (marca NEXO)
      const k = i / N;
      if (k < 0.55) {
        const a = rand() * Math.PI * 2, rr = 6.2 + (rand() - 0.5) * 0.18;
        return [Math.cos(a) * rr, Math.sin(a) * rr, (rand() - 0.5) * 0.15];
      }
      const nodes = [[-3.8, -1.2], [0, -3.4], [3.8, -1.2], [2.3, 3.1], [-2.3, 3.1]];
      if (k < 0.75) {
        const n = nodes[i % 5], a = rand() * Math.PI * 2, rr = Math.sqrt(rand()) * 0.55;
        return [n[0] + Math.cos(a) * rr, -n[1] + Math.sin(a) * rr, (rand() - 0.5) * 0.2];
      }
      const e = i % 5, A = nodes[e], B = nodes[(e + 2) % 5], t = rand();
      return [lerp(A[0], B[0], t), -lerp(A[1], B[1], t), (rand() - 0.5) * 0.08];
    }

    const shapes = [shapeSphere, shapeTorusKnot, shapeCube, shapeGalaxy, shapeLogo].map(fn => {
      const arr = new Float32Array(N * 3);
      for (let i = 0; i < N; i++) arr.set(fn(i), i * 3);
      return arr;
    });
    const delay = new Float32Array(N);
    const sizeAttr = new Float32Array(N);
    const colorAttr = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      delay[i] = rand();
      sizeAttr[i] = 0.6 + Math.pow(rand(), 3) * 2.4;
      const c = rand() < 0.18 ? WHITE : GREEN.clone().lerp(LIME, rand());
      colorAttr.set([c.r, c.g, c.b], i * 3);
    }

    const pGeo = new THREE.BufferGeometry();
    const pPos = new Float32Array(N * 3);
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    pGeo.setAttribute('aSize', new THREE.BufferAttribute(sizeAttr, 1));
    pGeo.setAttribute('aColor', new THREE.BufferAttribute(colorAttr, 3));

    const pMat = new THREE.ShaderMaterial({
      uniforms: { uScale: { value: 1 }, uOpacity: { value: 1 } },
      vertexShader: `
        attribute float aSize; attribute vec3 aColor; varying vec3 vColor; varying float vFade;
        uniform float uScale;
        void main(){
          vec4 mv = modelViewMatrix * vec4(position,1.0);
          gl_Position = projectionMatrix * mv;
          gl_PointSize = min(aSize * uScale * (34.0 / -mv.z), 9.0 * uScale);
          vColor = aColor;
          vFade = smoothstep(0.4, 3.0, -mv.z);
        }`,
      fragmentShader: `
        varying vec3 vColor; varying float vFade; uniform float uOpacity;
        void main(){
          float d = length(gl_PointCoord - 0.5);
          float a = smoothstep(0.5, 0.0, d);
          gl_FragColor = vec4(vColor * (0.35 + 0.65 * a), a * 0.55 * uOpacity * vFade);
        }`,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
    });
    const points = new THREE.Points(pGeo, pMat);
    scene.add(points);

    // Etapas de forma: [índice, inicio transición, fin transición]
    const morphs = [
      { from: 0, to: 1, a: 2.5, b: 3.9 },
      { from: 1, to: 2, a: 5.9, b: 7.2 },
      { from: 2, to: 3, a: 9.1, b: 10.4 },
      { from: 3, to: 4, a: 11.6, b: 13.2 },
    ];

    function updateParticles(t) {
      let from = 0, to = 0, p = 0;
      for (const m of morphs) {
        if (t >= m.a) { from = m.from; to = m.to; p = prog(t, m.a, m.b); }
      }
      if (t < morphs[0].a) { from = to = 0; p = 0; }
      const A = shapes[from], B = shapes[to];
      const swirl = Math.sin(p * Math.PI); // turbulencia en mitad de la transición
      for (let i = 0; i < N; i++) {
        const d = delay[i] * 0.45;
        const lp = ease.inOutCubic(clamp((p - d) / 0.55));
        const ix = i * 3;
        let x = lerp(A[ix], B[ix], lp), y = lerp(A[ix + 1], B[ix + 1], lp), z = lerp(A[ix + 2], B[ix + 2], lp);
        if (swirl > 0.001) {
          const ang = swirl * 1.6 * (delay[i] - 0.5);
          const c = Math.cos(ang), s = Math.sin(ang);
          const nx = x * c - z * s, nz = x * s + z * c;
          const n = Math.sin(i * 12.9898 + t * 3.0) * 0.9 * swirl;
          x = nx + n * 0.4; z = nz + n * 0.4; y += Math.cos(i * 4.1 + t * 2.0) * 0.6 * swirl;
        }
        // respiración sutil
        const br = 1 + Math.sin(t * 2.2 + delay[i] * 6.28) * 0.012;
        pPos[ix] = x * br; pPos[ix + 1] = y * br; pPos[ix + 2] = z * br;
      }
      pGeo.attributes.position.needsUpdate = true;
    }

    // ---------- Núcleo: icosaedro facetado + alambre ----------
    const core = new THREE.Group();
    scene.add(core);
    const coreSolid = new THREE.Mesh(
      new THREE.IcosahedronGeometry(1.3, 0),
      new THREE.MeshStandardMaterial({ color: 0x0e1408, metalness: 0.9, roughness: 0.25, emissive: 0x8db843, emissiveIntensity: 0.25, flatShading: true })
    );
    const coreWire = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(1.75, 1)),
      new THREE.LineBasicMaterial({ color: 0xd4f58a, transparent: true, opacity: 0.7 })
    );
    core.add(coreSolid, coreWire);

    // ---------- Anillos orbitales ----------
    const rings = [];
    for (let k = 0; k < 3; k++) {
      const m = new THREE.Mesh(
        new THREE.TorusGeometry(5.2 + k * 1.1, 0.018 + k * 0.006, 8, 220),
        new THREE.MeshBasicMaterial({ color: k === 1 ? 0xf2f6ec : 0x8db843, transparent: true, opacity: 0.8 })
      );
      m.rotation.x = Math.PI / 2 + (k - 1) * 0.5;
      m.rotation.y = (k - 1) * 0.35;
      scene.add(m);
      rings.push(m);
    }

    // ---------- Nodos flotantes conectados (fondo) ----------
    const nodeCount = 46;
    const nodeGeo = new THREE.BoxGeometry(0.28, 0.28, 0.28);
    const nodeMat = new THREE.MeshStandardMaterial({ color: 0x11180a, emissive: 0x8db843, emissiveIntensity: 0.6, metalness: 0.6, roughness: 0.3 });
    const nodes = new THREE.InstancedMesh(nodeGeo, nodeMat, nodeCount);
    const nodeBase = [];
    for (let i = 0; i < nodeCount; i++) {
      const r = 11 + rand() * 14, a = rand() * Math.PI * 2, y = (rand() - 0.5) * 14;
      nodeBase.push(new THREE.Vector3(Math.cos(a) * r, y, Math.sin(a) * r - 4));
    }
    scene.add(nodes);
    const linkPairs = [];
    for (let i = 0; i < nodeCount; i++) for (let j = i + 1; j < nodeCount; j++)
      if (nodeBase[i].distanceTo(nodeBase[j]) < 7.5) linkPairs.push([i, j]);
    const linkPos = new Float32Array(linkPairs.length * 6);
    const linkGeo = new THREE.BufferGeometry();
    linkGeo.setAttribute('position', new THREE.BufferAttribute(linkPos, 3));
    const links = new THREE.LineSegments(linkGeo, new THREE.LineBasicMaterial({ color: 0x8db843, transparent: true, opacity: 0.18 }));
    scene.add(links);

    // ---------- Polvo de fondo ----------
    const dustN = 1800, dustPos = new Float32Array(dustN * 3);
    for (let i = 0; i < dustN; i++) dustPos.set([(rand() - 0.5) * 90, (rand() - 0.5) * 50, (rand() - 0.5) * 90], i * 3);
    const dustGeo = new THREE.BufferGeometry();
    dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
    const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ color: 0x9fb87a, size: 0.06, transparent: true, opacity: 0.5, depthWrite: false }));
    scene.add(dust);

    // ---------- Suelo de retícula ----------
    const grid = new THREE.GridHelper(120, 80, 0x8db843, 0x1c2a12);
    grid.position.y = -7;
    grid.material.transparent = true;
    grid.material.opacity = 0.25;
    scene.add(grid);

    // ================= Cámara continua (spline) =================
    // Claves [t, posición, objetivo]
    const camKeys = [
      [0.0, [0, 1.5, 34], [0, 0, 0]],
      [3.0, [2.5, 1.0, 15], [0, 0, 0]],
      [6.0, [13, 5, 9], [0, 0.5, 0]],
      [9.0, [-11, -2.5, 9], [0, 0, 0]],
      [10.8, [-3, 9, 7], [0, 0, 0]],
      [12.6, [0, 1.2, 5.5], [0, 0, 0]],
      [15.0, [0, 0, 17.5], [0, 0, 0]],
    ];
    const posCurve = new THREE.CatmullRomCurve3(camKeys.map(k => new THREE.Vector3(...k[1])), false, 'centripetal');
    const tgtCurve = new THREE.CatmullRomCurve3(camKeys.map(k => new THREE.Vector3(...k[2])), false, 'centripetal');

    // Mapea tiempo → parámetro de curva con ritmo por tramo (sin cortes, velocidad continua)
    function camParam(t) {
      const n = camKeys.length - 1;
      for (let i = 0; i < n; i++) {
        const [t0] = camKeys[i], [t1] = camKeys[i + 1];
        if (t <= t1) {
          const l = (t - t0) / (t1 - t0);
          // suavizado leve dentro del tramo para que la velocidad fluya entre claves
          const s = lerp(l, ease.inOutCubic(l), 0.35);
          return (i + s) / n;
        }
      }
      return 1;
    }
    const tmpV = new THREE.Vector3();
    function updateCamera(t) {
      const u = camParam(clamp(t, 0, DURATION));
      posCurve.getPoint(u, camera.position);
      tgtCurve.getPoint(u, tmpV);
      // micro-movimiento de cámara en mano
      camera.position.x += Math.sin(t * 1.3) * 0.08;
      camera.position.y += Math.cos(t * 1.7) * 0.06;
      camera.lookAt(tmpV);
      camera.rotation.z += Math.sin(t * 0.6) * 0.02 + (t > 9 && t < 11.5 ? Math.sin(prog(t, 9, 11.5) * Math.PI) * 0.12 : 0);
      // "dolly zoom" sutil durante el final
      camera.fov = 42 + Math.sin(prog(t, 11.8, 14) * Math.PI) * 10;
      camera.updateProjectionMatrix();
    }

    // ================= Post-procesado =================
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.8, 0.5, 0.3);
    composer.addPass(bloom);
    composer.addPass(new OutputPass());

    function resize() {
      const w = innerWidth, h = innerHeight;
      renderer.setSize(w, h, false);
      composer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      pMat.uniforms.uScale.value = h / 900 * renderer.getPixelRatio();
    }
    addEventListener('resize', resize);
    resize();

    // ================= Tipografía cinética =================
    // Divide palabras en caracteres (conservando spans de acento)
    document.querySelectorAll('[data-split]').forEach(el => {
      const frag = document.createDocumentFragment();
      const walk = (node, cls) => {
        node.childNodes.forEach(c => {
          if (c.nodeType === 3) {
            [...c.textContent].forEach(chr => {
              const s = document.createElement('span');
              s.className = 'ch' + (cls ? ' ' + cls : '');
              s.textContent = chr === ' ' ? ' ' : chr;
              frag.appendChild(s);
            });
          } else walk(c, c.className);
        });
      };
      walk(el, '');
      el.innerHTML = '';
      el.appendChild(frag);
    });

    const $ = s => document.querySelector(s);
    const S = [1, 2, 3, 4, 5].map(i => $('#s' + i));
    const chars = el => [...el.querySelectorAll('.ch')];

    const s1c = chars(S[0].querySelector('.word'));
    const s2c = chars(S[1].querySelector('.word'));
    const s3w = [...S[2].querySelectorAll('.mask > .word')];
    const s4w = [...S[3].querySelectorAll('.word')];
    const s5c = chars(S[4].querySelector('.word'));
    const subs = S.map(s => s.querySelector('.sub'));
    const rule = S[4].querySelector('.rule');
    const ringC = $('#ringC'), ringP = $('#ringP'), ringSvg = $('#ring'), flash = $('#flash');
    const RING_LEN = 2 * Math.PI * 92, PATH_LEN = ringP.getTotalLength();
    ringC.style.strokeDasharray = RING_LEN;
    ringP.style.strokeDasharray = PATH_LEN;

    const set = (el, tf, op, blur = 0) => {
      el.style.transform = tf;
      el.style.opacity = op;
      el.style.filter = blur > 0.05 ? `blur(${blur.toFixed(2)}px)` : 'none';
    };

    function updateType(t) {
      // ---- Escena 1: CONECTA (0.3 – 3.1) caen desde la profundidad ----
      S[0].style.opacity = t > 0.2 && t < 3.3 ? 1 : 0;
      s1c.forEach((c, i) => {
        const pin = ease.outExpo(prog(t, 0.35 + i * 0.07, 1.25 + i * 0.07));
        const pout = ease.inExpo(prog(t, 2.55 + i * 0.03, 3.1 + i * 0.03));
        const z = lerp(-1400, 0, pin) + pout * 300;
        const rx = lerp(-95, 0, pin);
        const y = -pout * 160;
        set(c, `translate3d(0,${y}px,${z}px) rotateX(${rx}deg) skewY(${pout * -12}deg)`, pin * (1 - pout), (1 - pin) * 14 + pout * 10);
      });
      { const p = ease.outCubic(prog(t, 1.2, 1.9)), q = prog(t, 2.5, 2.9);
        set(subs[0], `translateY(${(1 - p) * 20}px)`, p * (1 - q)); subs[0].style.letterSpacing = `${0.6 - p * 0.25}em`; }

      // ---- Escena 2: AUTOMATIZA (3.5 – 6.2) explosión desde el centro ----
      S[1].style.opacity = t > 3.4 && t < 6.4 ? 1 : 0;
      const mid2 = (s2c.length - 1) / 2;
      s2c.forEach((c, i) => {
        const d = Math.abs(i - mid2);
        const pin = ease.outBack(prog(t, 3.55 + d * 0.06, 4.25 + d * 0.06));
        const pout = ease.inCubic(prog(t, 5.7, 6.25));
        const spread = (i - mid2) * pout * 90;
        const rot = (1 - pin) * (i % 2 ? 120 : -120);
        set(c, `translate3d(${spread}px,${(1 - clamp(pin)) * (i % 2 ? 80 : -80)}px,0) scale(${clamp(pin, 0, 1.2)}) rotateZ(${rot}deg) rotateY(${pout * 90}deg)`, clamp(pin * 1.5) * (1 - pout), pout * 12);
      });
      { const p = ease.outCubic(prog(t, 4.4, 5.0)), q = prog(t, 5.6, 6.0);
        set(subs[1], `translateY(${(1 - p) * 20}px)`, p * (1 - q)); }

      // ---- Escena 3: SIN LÍMITES (6.6 – 9.3) revelado con máscara ----
      S[2].style.opacity = t > 6.5 && t < 9.4 ? 1 : 0;
      s3w.forEach((w, i) => {
        const pin = ease.inOutQuint(prog(t, 6.65 + i * 0.18, 7.45 + i * 0.18));
        const pout = ease.inOutQuint(prog(t, 8.6 + i * 0.1, 9.25 + i * 0.1));
        const y = (1 - pin) * 110 - pout * 110;
        w.style.transform = `translateY(${y}%) scaleY(${1 + (1 - pin) * 0.4})`;
        w.style.letterSpacing = `${lerp(-0.02, 0.08, ease.outCubic(prog(t, 7.4, 8.8)))}em`;
      });

      // ---- Escena 4: ráfaga de palabras (9.6 – 11.9) ----
      S[3].style.opacity = t > 9.55 && t < 11.95 ? 1 : 0;
      s4w.forEach((w, k) => {
        const t0 = 9.6 + k * 0.75, t1 = t0 + 0.75;
        const cs = chars(w);
        const on = t >= t0 - 0.02 && t < t1 + 0.1;
        w.style.opacity = on ? 1 : 0;
        cs.forEach((c, i) => {
          const pin = ease.outExpo(prog(t, t0 + i * 0.018, t0 + 0.32 + i * 0.018));
          const pout = ease.inExpo(prog(t, t1 - 0.2 + i * 0.01, t1 + 0.02 + i * 0.01));
          const dir = k % 2 ? 1 : -1;
          set(c, `translate3d(${dir * (1 - pin) * 240 - dir * pout * 240}px,0,0) skewX(${dir * (1 - pin) * -25}deg)`, pin * (1 - pout), (1 - pin) * 18 + pout * 18);
        });
      });

      // ---- Escena 5: NEXO (12.3 – 15) ensamblaje + tagline ----
      S[4].style.opacity = t > 12.2 ? 1 : 0;
      s5c.forEach((c, i) => {
        const pin = ease.outExpo(prog(t, 12.35 + i * 0.09, 13.6 + i * 0.09));
        const offs = (i - 1.5) * (1 - pin) * 220;
        set(c, `translate3d(${offs}px,0,${(1 - pin) * 600}px) rotateY(${(1 - pin) * (i - 1.5) * 40}deg)`, pin, (1 - pin) * 16);
      });
      { const p = ease.inOutCubic(prog(t, 13.4, 14.2));
        rule.style.transform = `scaleX(${p})`; rule.style.opacity = p;
        const q = ease.outCubic(prog(t, 13.8, 14.5));
        set(subs[4], `translateY(${(1 - q) * 14}px)`, q); subs[4].style.letterSpacing = `${0.6 - q * 0.25}em`; }

      // ---- Anillo SVG: se dibuja en S2, gira en S3, se cierra en el final ----
      const draw = ease.inOutCubic(prog(t, 3.4, 4.6)) - ease.inOutCubic(prog(t, 8.8, 9.6)) + ease.inOutCubic(prog(t, 12.6, 14.0));
      ringC.style.strokeDashoffset = RING_LEN * (1 - clamp(draw));
      const pdraw = ease.inOutCubic(prog(t, 6.6, 7.8)) - ease.inOutCubic(prog(t, 8.6, 9.3));
      ringP.style.strokeDashoffset = PATH_LEN * (1 - clamp(pdraw));
      ringSvg.style.transform = `translate(-50%,-50%) rotate(${t * 18}deg) scale(${1 + ease.outCubic(prog(t, 12.6, 15)) * 0.12})`;
      ringSvg.style.opacity = t > 12 ? 0.55 : 0.85;

      // Destellos en cambios de escena
      const flashes = [3.35, 6.45, 9.5, 12.25];
      let f = 0;
      flashes.forEach(ft => { const d = t - ft; if (d > -0.05 && d < 0.5) f = Math.max(f, Math.exp(-d * 9) * (d < 0 ? 0 : 1)); });
      flash.style.opacity = f * 0.55;
    }

    // ================= Actualización 3D =================
    const dummy = new THREE.Object3D();
    function updateWorld(t) {
      updateParticles(t);

      // Partículas giran y aparecen
      points.rotation.y = t < 11.6 ? t * 0.22 : lerp(11.6 * 0.22, Math.round(11.6 * 0.22 / (Math.PI * 2)) * Math.PI * 2, ease.inOutCubic(prog(t, 11.6, 13.2)));
      points.rotation.x = Math.sin(t * 0.4) * 0.15 * (1 - prog(t, 11.6, 13.2));
      pMat.uniforms.uOpacity.value = ease.outCubic(prog(t, 0, 1.4));

      // Núcleo: late en cada transición, desaparece en el final
      const pulse = morphs.reduce((acc, m) => acc + Math.sin(prog(t, m.a, m.b) * Math.PI) * 0.6, 0);
      const coreVis = ease.outBack(prog(t, 0.6, 1.8)) * (1 - ease.inCubic(prog(t, 11.8, 12.8)));
      core.scale.setScalar(Math.max(0.0001, coreVis * (1 + pulse)));
      core.rotation.set(t * 0.5, t * 0.8, t * 0.2);
      coreWire.rotation.set(-t * 0.9, t * 0.3, 0);
      coreSolid.material.emissiveIntensity = 0.25 + pulse * 1.2;

      // Anillos
      rings.forEach((r, k) => {
        const s = ease.outExpo(prog(t, 1.0 + k * 0.25, 2.6 + k * 0.25));
        const finale = ease.inOutCubic(prog(t, 11.8, 13.4));
        r.scale.setScalar(Math.max(0.0001, s * lerp(1, 1.18 + k * 0.08, finale)));
        r.rotation.z = t * (0.25 + k * 0.12) * (k % 2 ? -1 : 1);
        r.rotation.x = lerp(Math.PI / 2 + (k - 1) * 0.5, 0, finale);
        r.rotation.y = lerp((k - 1) * 0.35, 0, finale);
        r.material.opacity = 0.8 * s * (k === 1 ? 1 - finale * 0.6 : 1);
      });

      // Nodos y enlaces
      for (let i = 0; i < nodeCount; i++) {
        const b = nodeBase[i];
        dummy.position.set(b.x, b.y + Math.sin(t * 0.8 + i) * 0.5, b.z);
        dummy.rotation.set(t * 0.6 + i, t * 0.4 + i * 2, 0);
        dummy.scale.setScalar(ease.outBack(prog(t, 0.8 + (i % 10) * 0.12, 1.8 + (i % 10) * 0.12)) + 0.0001);
        dummy.updateMatrix();
        nodes.setMatrixAt(i, dummy.matrix);
      }
      nodes.instanceMatrix.needsUpdate = true;
      linkPairs.forEach(([a, b], k) => {
        const A = nodeBase[a], B = nodeBase[b];
        linkPos.set([A.x, A.y + Math.sin(t * 0.8 + a) * 0.5, A.z, B.x, B.y + Math.sin(t * 0.8 + b) * 0.5, B.z], k * 6);
      });
      linkGeo.attributes.position.needsUpdate = true;
      links.material.opacity = 0.18 * prog(t, 1.5, 3) + Math.sin(t * 6) * 0.02;

      dust.rotation.y = t * 0.02;
      grid.position.z = (t * 2.5) % 1.5;
      grid.material.opacity = 0.25 * (1 - prog(t, 11.5, 13));

      key.intensity = 220 + pulse * 300;
      bloom.strength = 0.7 + pulse * 0.35 + ease.outCubic(prog(t, 12.2, 13.5)) * 0.15;

      updateCamera(t);
    }

    function render(t) {
      updateWorld(t);
      updateType(t);
      composer.render();
    }

    // ================= Reproducción =================
    const fill = $('#fill'), clock = $('#clock'), playBtn = $('#play');
    let playing = !CAPTURE, cur = Number(params.get('t')) || 0, last = performance.now();

    function frame(now) {
      const dt = Math.min(0.1, (now - last) / 1000);
      last = now;
      if (playing) {
        cur += dt;
        if (cur >= DURATION + 1.2) cur = 0; // bucle con pausa en el plano final
      }
      const t = Math.min(cur, DURATION);
      render(t);
      fill.style.width = (t / DURATION * 100) + '%';
      clock.textContent = `${t.toFixed(2).padStart(5, '0')} / 15.00`;
      requestAnimationFrame(frame);
    }

    playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? '❚❚' : '▶'; };
    $('#replay').onclick = () => { cur = 0; playing = true; playBtn.textContent = '❚❚'; };
    $('#track').onclick = e => { const r = e.currentTarget.getBoundingClientRect(); cur = (e.clientX - r.left) / r.width * DURATION; };
    addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); playBtn.click(); } });

    // Hook para exportar fotogramas de forma determinista
    window.__renderAt = t => { render(t); return true; };
    window.__ready = true;

    if (CAPTURE) render(cur); else requestAnimationFrame(frame);
  </script>
</body>

</html>
